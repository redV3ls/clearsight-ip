name = "clearsight-ip"
main = "src/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "clearsight-ip"
vars = { NODE_ENV = "production", LOG_LEVEL = "info", CORS_ORIGIN = "https://clearsight-ip.com", RATE_LIMIT_WINDOW_MS = "900000", RATE_LIMIT_MAX_REQUESTS = "100", ENABLE_RATE_LIMITING = "true", DEEPSEEK_BASE_URL = "https://api.deepseek.com/v1", DEEPSEEK_MODEL = "deepseek-chat", DEEPSEEK_MAX_TOKENS = "3000", DEEPSEEK_TEMPERATURE = "0.2", DEEPSEEK_TIMEOUT = "60000" }

# D1 Database binding for production
[[env.production.d1_databases]]
binding = "DB"
database_name = "clearsight-ip-db"
database_id = "cd183d35-d22b-4a22-bbfb-f40c2d69cd16"

# KV namespace for caching in production
[[env.production.kv_namespaces]]
binding = "CACHE"
id = "747058b5407243d9846eb3ca1d6ef563"

[env.staging]
name = "clearsight-ip-staging"
vars = { NODE_ENV = "staging", LOG_LEVEL = "debug", ENABLE_RATE_LIMITING = "true" }

[env.development]
name = "clearsight-ip-dev"
vars = { NODE_ENV = "development", LOG_LEVEL = "debug", ENABLE_RATE_LIMITING = "false" }

# Environment variables (set these in Cloudflare dashboard or via wrangler secret) 
[vars]
NODE_ENV = "production"
CORS_ORIGIN = "https://clearsight-ip.com"
RATE_LIMIT_WINDOW_MS = "900000"
RATE_LIMIT_MAX_REQUESTS = "100"
LOG_LEVEL = "info"
ENABLE_RATE_LIMITING = "true"
# DeepSeek AI Configuration
DEEPSEEK_BASE_URL = "https://api.deepseek.com/v1"
DEEPSEEK_MODEL = "deepseek-chat"
DEEPSEEK_MAX_TOKENS = "3000"
DEEPSEEK_TEMPERATURE = "0.2"
DEEPSEEK_TIMEOUT = "60000"

# Secrets (use: wrangler secret put SECRET_NAME)
# JWT_SECRET
# DATABASE_URL (for D1 or external database)
# REDIS_URL (for Upstash Redis or similar)
# DEEPSEEK_API_KEY (for AI analysis features)

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "clearsight-ip-db"
database_id = "cd183d35-d22b-4a22-bbfb-f40c2d69cd16"

# KV namespace for caching
[[kv_namespaces]]
binding = "CACHE"
id = "747058b5407243d9846eb3ca1d6ef563"
preview_id = "1cbf2f6e3d594ddb9214dcc7986c1141"

