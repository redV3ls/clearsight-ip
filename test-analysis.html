<!DOCTYPE html>
<html>
<head>
    <title>Test Analysis</title>
</head>
<body>
    <h1>Test Analysis Endpoint</h1>
    <button onclick="testAuth()">Test Auth</button>
    <button onclick="testAnalysis()">Test Analysis</button>
    <div id="results"></div>

    <script>
        async function testAuth() {
            try {
                const response = await fetch('/api/v1/auth/me', {
                    method: 'GET',
                    credentials: 'include'
                });
                const data = await response.json();
                document.getElementById('results').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                console.log('Auth test:', data);
            } catch (error) {
                console.error('Auth test error:', error);
                document.getElementById('results').innerHTML = 'Auth test failed: ' + error.message;
            }
        }

        async function testAnalysis() {
            try {
                const formData = new FormData();
                formData.append('resumeText', 'Test resume content with JavaScript, React, Node.js skills');
                
                const response = await fetch('/api/v1/analyze/resume', {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });
                
                const data = await response.json();
                document.getElementById('results').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                console.log('Analysis test:', data);
            } catch (error) {
                console.error('Analysis test error:', error);
                document.getElementById('results').innerHTML = 'Analysis test failed: ' + error.message;
            }
        }
    </script>
</body>
</html>
